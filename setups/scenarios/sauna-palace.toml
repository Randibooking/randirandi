# General model acceptance fixture: fictional test values, not a customer delivery.
# Three saunas of eight spots without names and a gym of 20, in one space
# and none marked: each asset is booked on its own. Weekday shared sauna
# 10:00-18:00, capacity 8 and 100/50 kr tiers follow the approved
# example. Hourly starts, 1-8 daytime hours, private 18:00-22:00 at
# 800 kr, no weekend sauna configurations and the gym settings are
# fictional test choices.
# The setup of Sauna Palace.
# The format is described in docs/setup-file.md.

format = 3

