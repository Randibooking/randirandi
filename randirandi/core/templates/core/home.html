{% extends "core/base.html" %}
{% load words %}
{% block title %}{{ ui.organization }} · RandiRandi{% endblock %}
{% block content %}
  <p>{{ ui.organization }}</p>
  <h1>{% word "login.signed-in" %}</h1>
  <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">{% word "me.sign-out" %}</button>
  </form>
{% endblock %}
