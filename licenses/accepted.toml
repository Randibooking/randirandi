# SPDX-License-Identifier: AGPL-3.0-only
# Things whose licence the check cannot read from metadata, or whose metadata
# is messy, accepted once by hand (ADR-0024). Each entry names the thing, the
# version (an image's tag, an action's version comment), its licence and why
# it is fine. A new version needs a new entry.

[[accepted]]
name = "python"
version = "3.14-slim-bookworm"
licence = "PSF-2.0; the Debian packages in it are GPL and other free licences"
reason = "Runs on our hosting only; the image is handed to nobody."

[[accepted]]
name = "ghcr.io/astral-sh/uv"
version = "0.13"
licence = "MIT OR Apache-2.0"
reason = "Build tool; only copied into the build stage."

[[accepted]]
name = "postgres"
version = "17-bookworm"
licence = "PostgreSQL; the Debian packages in it are GPL and other free licences"
reason = "Runs on our hosting and in tests; handed to nobody. Free, no fee."

