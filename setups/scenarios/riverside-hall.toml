# General model acceptance fixture: fictional test values, not a customer delivery.
# Riverside Hall, the made-up venue of the booking container's model page
# (2026-10-17, section 3): open Monday to Thursday 10:00-22:00, Friday and
# Saturday 10:00-24:00, closed on Sunday. One asset with two floor plans:
# Seated, 12 seats in the sections Front (1-4) and Back (5-12), and
# Standing, 40 places without names. Four containers back to back: rehearsal
# hire Monday to Thursday 10:00-18:00, a seated concert on Friday 19:00-22:00,
# hall hire on Saturday 10:00-18:00 and a club night on Saturday 20:00-24:00.
# The page's quiz on Thursday 17:00-20:00 stacks on the rehearsal hire and
# loads (2026-10-19, ). Two containers are refused, as loader tests: a
# standing container on Friday 20:00-22:00 over the seated concert (two floor
# plans of one asset at one time) and a brunch on Sunday 11:00-14:00 (the hall
# is closed). Prices are made up.
# The setup of Riverside Hall.
# The format is described in docs/setup-file.md.

format = 3

[organization]
name = "Riverside Hall"
subdomain = "riverside-hall"
time_zone = "Europe/Oslo"
currency = "NOK"
contact_email = "bookings@riverside-hall.example"
standard_role = "Member"
member_retention_months = 12
booking_retention_months = 36

[[assets]]
number = 1
name = "Riverside Hall"
maximum_occupancy = 60

[[assets.floor_plans]]
name = "Seated"
spot_word = "seat"
spots = 12

[[assets.floor_plans.groups]]
name = "Front"
word = "section"
spots = [1, 2, 3, 4]

[[assets.floor_plans.groups]]
name = "Back"
word = "section"
spots = [5, 6, 7, 8, 9, 10, 11, 12]

[[assets.floor_plans]]
name = "Standing"
spot_word = "place"
spots = 40

[[availability_calendars]]
asset = "Riverside Hall"
spans = [
  { weekdays = ["mon", "tue", "wed", "thu"], start = "10:00", end = "22:00" },
  { weekdays = ["fri", "sat"], start = "10:00", end = "24:00" },
]

[[booking_types]]
